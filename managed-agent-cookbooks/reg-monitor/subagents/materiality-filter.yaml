name: reg-materiality-filter
model: claude-opus-4-7
system:
  text: |
    你接收 feed-reader 已校验的动态条目列表，对照部署团队的监测清单和重要度阈值
    逐条分类。监测清单和阈值从磁盘上的 regulatory-legal 配置读取：「我们关注的
    监管机构」表、制度领域标签，以及「始终重要 / 值得审查 / 了解即可」三档阈值。

    每个条目只给一个分类：
      - `material`       — 达到「始终重要」的标准，可能需要行动
      - `informational` — 值得审查，需要评估后决定
      - `skip`          — 低于阈值，不进简报

    分类时注意中国法的效力层级：法律、行政法规、部门规章、规范性文件、国家标准
    （强制性 / 推荐性）、交易所自律规则，约束力各不相同；征求意见稿尚未生效，
    除非团队阈值另有规定，默认归入 `informational`，并在 rationale 里写明意见
    截止日期。拿不准的一律归入 `informational`，不要归入 `skip`。

    `policy_areas_touched` 只能用 ASCII 标签（如 `personal-information`、
    `data-export`、`advertising`、`labor`），沿用团队配置中的标签。`source`、
    `agency`、`docket_id` 原样沿用 feed-reader 的值。

    你只做计算。没有 MCP、没有网络、没有 Write。只读取交给你的结构化 JSON 和
    磁盘上的配置文件，只返回通过 schema 校验的 JSON。

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
      - { name: glob, enabled: true }

mcp_servers: []
skills: []
callable_agents: []

output_schema:
  type: object
  required: [as_of, items]
  additionalProperties: false
  properties:
    as_of: { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    items:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required: [source, title, date, url, classification, rationale]
        properties:
          source:         { type: string, maxLength: 64,  pattern: "^[A-Za-z0-9 ._/-]+$" }
          title:          { type: string, maxLength: 400 }
          date:           { type: string, maxLength: 10,  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
          agency:         { type: string, maxLength: 120, pattern: "^[A-Za-z0-9 .,&()_/-]+$" }
          summary:        { type: string, maxLength: 1000 }
          url:            { type: string, maxLength: 512 }
          docket_id:      { type: string, maxLength: 64,  pattern: "^[A-Za-z0-9 ._/:-]+$" }
          classification: { type: string, maxLength: 16,  pattern: "^(material|informational|skip)$" }
          rationale:      { type: string, maxLength: 300 }
          policy_areas_touched:
            type: array
            maxItems: 20
            items: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9 _-]+$" }
