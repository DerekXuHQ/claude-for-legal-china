name: diligence-normalizer
model: claude-opus-4-7
system:
  text: |
    展开完成后，你收到完整的提取表格，执行 tabular-review 技能中描述的归一化
    环节。这一环节专门对付所有表格审查工具的通病：同一类条款在不同文件间
    被解读得不一致。

    对每个 `classify` 列：
      - 每个 `answered` 值都必须在选项列表中。不在的就是异常值——标出来，
        建议改为最接近的选项或 `needs_review`。
      - 留意可疑的少数派。如果 195 份文件是 `consent_required`、5 份是
        `freely_assignable`，把这 5 份标出来抽查。

    对每个 `date`、`duration` 和 `currency` 列：
      - 检查各行格式是否一致，格式混用的标出来。
      - 标出不合常理的值：99 年的期限、金额为 0 的责任上限、1900 年以前的
        日期、交易不涉及的币种、"万元"未换算成元导致的数量级错误。

    对每个 `verbatim` 列：
      - 你不能重读原文——那是 extractor 的范围。但可以标出可疑的改写痕迹：
        答案里出现"约""大致""基本上""总体而言"之类的概括性措辞，或出现
        原文提问中没有的方括号。

    返回标记和各列汇总计数。不改写单元格，只提出修正建议。最终输出由
    grid-writer 生成；你提供的标记清单，由它写入摘要的 `Flags` 部分。

    只读。不用 MCP。不持有 Write。不访问外部网络。只返回符合 schema 的 JSON。
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
mcp_servers: []
skills: []
callable_agents: []
output_schema:
  type: object
  required: [flags, column_summary]
  additionalProperties: false
  properties:
    flags:
      type: array
      maxItems: 5000
      items:
        type: object
        additionalProperties: false
        required: [doc_id, column_id, issue]
        properties:
          doc_id:        { type: string, maxLength: 64,  pattern: "^[A-Za-z0-9_.-]+$" }
          column_id:     { type: string, maxLength: 64,  pattern: "^[a-z0-9_]+$" }
          issue:
            type: string
            enum:
              - out_of_options
              - minority_cluster
              - format_inconsistent
              - implausible_value
              - paraphrase_suspected
              - missing_quote
              - other
          suggested_fix: { type: string, maxLength: 500 }
          note:          { type: string, maxLength: 500 }
    column_summary:
      type: array
      maxItems: 200
      items:
        type: object
        additionalProperties: false
        required: [column_id, answered, not_present, unclear, needs_review]
        properties:
          column_id:     { type: string, maxLength: 64, pattern: "^[a-z0-9_]+$" }
          answered:      { type: integer, minimum: 0 }
          not_present:   { type: integer, minimum: 0 }
          unclear:       { type: integer, minimum: 0 }
          needs_review:  { type: integer, minimum: 0 }
          outliers:      { type: integer, minimum: 0 }
          flagged:       { type: boolean }
