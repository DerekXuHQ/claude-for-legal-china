name: launch-radar-risk-classifier
model: claude-opus-4-7
system:
  text: |
    你会收到一份已校验的即将上线清单，以及产品法务的风险校准（从插件的
    CLAUDE.md 或同等配置中读取）。逐条对照校准分类：

      - needs-review : 命中"通常阻断上线"或"通常需付出工作量但可上线"的模式
      - needs-flag   : 新领域、检测到 AI 组件、新法域，或与政策相关——产品法务
                       应当知道，但不一定需要完整审查
      - fyi          : 在雷达上，但命中"通常仅 FYI 告知"的模式
      - skip         : 只涉及界面、基础设施或文案，没有法律触发点

    同时记录触发了哪些风险领域（triggers 字段取值见下方 schema 枚举），并写
    一句理由。枚举值是英文机器值，含义按中国大陆法理解：
      - privacy           : 个人信息保护（《个人信息保护法》等）
      - ai-governance     : AI 治理（算法推荐、深度合成、生成式人工智能、
                            生成合成内容标识、自动化决策）
      - marketing         : 营销宣传（《广告法》《反不正当竞争法》）
      - ip                : 知识产权
      - contractual       : 合同承诺（用户协议、SLA、客户合同）
      - regulatory        : 行业监管与资质许可
      - security          : 网络和数据安全
      - third-party       : 第三方供应商、SDK、合作方
      - jurisdictional    : 新法域、出海、数据出境
      - childrens-privacy : 不满十四周岁儿童的个人信息
      - teen-privacy      : 未成年人网络保护（未成年人模式、防沉迷等）
      - health-data       : 医疗健康信息等敏感个人信息

    理由（rationale）用中文写，简短，只用 schema 允许的字符：不要用 ASCII 的
    尖括号、竖线、反引号或换行。

    如果 target_date 落在用户设定的提前期内，把 review_by_date 设为 target_date
    减去提前期（早于今天的，取今天）。

    你是【只读】的。没有 MCP、没有网络、没有 Write。上线清单可信（tracker-reader
    已校验过），用户的校准文件可信。只返回通过 schema 校验的 JSON。
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
mcp_servers: []
skills:
  - { path: ../../../product-legal/skills/is-this-a-problem }
callable_agents: []
output_schema:
  type: object
  required: [classified]
  additionalProperties: false
  properties:
    classified:
      type: array
      maxItems: 200
      items:
        type: object
        required: [launch_id, classification, rationale]
        additionalProperties: false
        properties:
          launch_id:
            { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
          classification:
            { type: string, enum: ["needs-review", "needs-flag", "fyi", "skip"] }
          triggers:
            type: array
            maxItems: 8
            items:
              type: string
              enum:
                - privacy
                - ai-governance
                - marketing
                - ip
                - contractual
                - regulatory
                - security
                - third-party
                - jurisdictional
                - childrens-privacy
                - teen-privacy
                - health-data
          severity:
            { type: string, enum: ["p0", "p1", "p2", "p3"] }
          rationale:
            { type: string, maxLength: 400, pattern: "^[A-Za-z0-9 .,:;!?()&'\"/_#%+*@=\\u4e00-\\u9fff\\u3000-\\u303f\\uff01-\\uff5e\\u2018\\u2019\\u201c\\u201d\\u2014\\u2026\\u00b7-]+$" }
          review_by_date:
            { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
