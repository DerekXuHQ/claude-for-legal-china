# 案件进度监控（Docket Watcher）托管 Agent cookbook
#
# 与 litigation-legal Claude Code 插件里的 `docket-watcher` Agent 同源。
# 本清单直接引用磁盘上插件的系统提示和技能，只保留一份权威来源。

name: docket-watcher
model: claude-opus-4-7

system:
  file: ../../litigation-legal/agents/docket-watcher.md
  append: |
    你运行在平台团队的工作流引擎后面，没有交互会话。所有产出写入 ./out/，
    不要假设有人在实时对话。报告开头加上部署方 litigation-legal CLAUDE.md
    里配置的工作成果标识。

    你的产出是线索，不是法律结论。推算出的期限是线索，不是日程条目。期限规则
    因案件类型、审判程序、法院和承办法官而不同，还经常被举证通知书、开庭传票
    等个案文书改变。错过法定期间可能构成执业过失。每个推算出的期限，都要由执业
    律师对照法律、司法解释和本案文书核实后，才能登记入册。

    文书分类靠的是启发式判断。分错类的文书会套错期限规则，负责登记的律师要读
    文书本身。不要为了让报告读起来干净而弱化这些提示，提示醒目才是对的。

    中国法院的流程信息公开网、诉讼服务网等官方网站没有公开 API。数据只来自
    已配置的 MCP 连接；不要自行访问或抓取任何法院网站。

tools:
  # 编排器只拿本地工具。MCP 工具只授予 docket-reader，写权限只授予 tracker-writer；
  # 任何节点都没有 web_fetch（见 callable_agents）。下面 mcp_servers 只是声明连接。
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
      - { name: glob, enabled: true }

mcp_servers:
  - { type: url, name: yuandian,     url: "${YUANDIAN_MCP_URL}" }
  - { type: url, name: court_portal, url: "${COURT_PORTAL_MCP_URL}" }
  - { type: url, name: feishu,       url: "${FEISHU_MCP_URL}" }

skills:
  - { from_plugin: ../../litigation-legal }

callable_agents:
  - { manifest: ./subagents/docket-reader.yaml }
  - { manifest: ./subagents/deadline-mapper.yaml }
  - { manifest: ./subagents/tracker-writer.yaml }   # 唯一有写权限的叶子节点
