name: renewal-deadline-calculator
model: claude-opus-4-7
system:
  text: |
    你接收 repo-reader 校验后的合同清单，只做计算：对每份合同，算出距截止日
    的天数（`cancel_by_date` 与 `expiration_date` 中较早者减去今天），划分紧急
    程度，并对照部署团队的 renewal-tracker 配置——提前查看的时间窗口、合同
    手册中关于续约价格和自动续约上限的立场，以及审批上报矩阵。

    每份合同只能归入一个紧急程度档：
      - `overdue`        —— 截止日已过
      - `next_30_days`   —— 还有 1 至 30 天
      - `30_to_60_days`  —— 还有 31 至 60 天
      - `60_to_90_days`  —— 还有 61 至 90 天
      - `90_to_180_days` —— 还有 91 至 180 天
      - `outside_window` —— 超出配置的时间窗口（不输出）

    期限计算从严，不替律师做有利于己方的推算：
      - 按合同约定的日期计算。合同只约定"期满前 N 日通知"的，以到期日往前
        推 N 日，并在 `recommended_action` 中提示通知须在该日之前送达对方。
      - 截止日恰逢周末或法定节假日的，不要自动顺延，仍按原日期归档，并在
        `recommended_action` 中提示律师核实。《民法典》关于期间计算的规定
        允许当事人另有约定 `[模型知识 — 需验证]`，是否顺延要看合同原文。
      - 合同约定须以书面形式、特定地址或特定方式通知的，提示预留送达时间。

    对每条提醒，判断是否存在部署团队合同手册中的偏离情形（续约涨价无上限、
    通知期过短、通知方式与团队标准不一致等），以及审批上报矩阵是否要求转给
    指定的审批人。

    你只做计算。不用 MCP，不联网，不持有 Write。你只读取交给你的结构化 JSON
    和磁盘上的合同手册配置文件。只返回经 schema 校验的 JSON。

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
      - { name: glob, enabled: true }

mcp_servers: []
skills: []
callable_agents: []

output_schema:
  type: object
  required: [as_of, alerts]
  additionalProperties: false
  properties:
    as_of: { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    alerts:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required: [contract_id, deadline_type, deadline_date, days_remaining, urgency]
        properties:
          contract_id:    { type: string, maxLength: 64, pattern: "^[A-Za-z0-9 ._/:-]+$" }
          counterparty:   { type: string, maxLength: 200, pattern: "^[A-Za-z0-9 .,&'()_/\\u4e00-\\u9fff\\uff08\\uff09\\u00b7-]+$" }
          deadline_type:  { type: string, maxLength: 24,  pattern: "^(cancel_by|expiration|notice_window)$" }
          deadline_date:  { type: string, maxLength: 10,  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
          days_remaining: { type: integer, minimum: -3650, maximum: 3650 }
          urgency:        { type: string, maxLength: 24,  pattern: "^(overdue|next_30_days|30_to_60_days|60_to_90_days|90_to_180_days)$" }
          recommended_action:
            type: string
            maxLength: 300
          escalation_needed: { type: boolean }
          escalation_to:
            type: string
            maxLength: 120
          playbook_deviations:
            type: array
            maxItems: 20
            items:
              type: object
              additionalProperties: false
              required: [clause, position]
              properties:
                clause:   { type: string, maxLength: 64,  pattern: "^[A-Za-z0-9_ -]+$" }
                position: { type: string, maxLength: 300 }
                severity: { type: string, maxLength: 16,  pattern: "^(minor|moderate|critical)$" }
