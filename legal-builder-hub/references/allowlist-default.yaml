# legal-builder-hub 默认白名单
# 由 /legal-builder-hub:cold-start-interview 生成。要改变信任范围，编辑本文件。
# 完整字段说明见 skill-installer/references/allowlist.md。
#
# 安全提示：本默认配置是严格模式（restrictive），未列出的来源一律拒绝。
# 首次设置访谈会询问独立执业、没有 IT 部门维护发布者名单的用户，是否改成
# 宽松模式（permissive）。如果你从没运行过设置却看到了这个文件，安装器会拒绝
# 下面没有明确列出的任何来源。这是有意的：这个工具会把第三方代码装进存放
# 敏感法律材料的工作环境，默认拒绝才是对的。运行
# /legal-builder-hub:cold-start-interview 进行配置；如果清楚其中的取舍，也可以
# 直接编辑本文件。

mode: restrictive    # restrictive（默认，拒绝未列出的来源）| permissive（标记并询问）

registries:
  - https://github.com/legalopsconsulting/lpm-skills
  # Lawvable：首发合作方，在 lawvable GitHub 组织下维护两个精选技能源。
  - https://github.com/lawvable/awesome-legal-skills
  - https://github.com/lawvable/agent-skills

publishers:
  - legalopsconsulting
  - lawvable

connectors: []
  # 严格模式下留空，表示凡是声明了任何 MCP 连接器的社区技能都会被拒绝。
  # 在这里添加经批准的 MCP 服务地址，或者改成宽松模式，改为标记并询问。

licenses:
  # 社区技能可以使用的 SPDX 许可证标识符。以下为个人使用的默认值。
  # 首次设置时按使用场景（个人 / 律所内部 / 嵌入产品）设定。
  # 见 skill-installer/references/allowlist.md。
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - CC0-1.0
