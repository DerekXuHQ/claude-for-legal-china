<h1>帮助与支持</h1>
<h2>不注册能用吗？</h2><p>能。法规检索、浏览、事项、台账和本机小模型都不需要账号。</p>
<h2>怎么开通在线模型？</h2><p>在「设置 → 账号」用邮箱注册，填写用途。开通后打开 App 会自动连上，不需要自己填 API key。</p>
<h2>忘记密码</h2><p>请通过下面的项目页面联系我们重置。</p>
<h2>删除账号</h2><p>「设置 → 账号 → 删除账号」，输入密码确认即可，立即生效。</p>
<h2>联系</h2><p><a href="https://github.com/DerekXuHQ/claude-for-legal-china/issues">github.com/DerekXuHQ/claude-for-legal-china/issues</a></p>
<p>本 App 内容仅供参考，不构成法律意见。</p>
